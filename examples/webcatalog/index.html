<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning catalog</title><meta name="description" content="A complete local TypeScript catalog project."><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body>
<a class="skip" href="#main">Skip to content</a><header><nav aria-label="Main navigation"><a href="index.html" aria-current="page">Catalog</a><a href="about.html">About this project</a></nav></header>
<main id="main"><h1>Learning catalog</h1><p>Filter six sample courses and save bookmarks on this device.</p>
<form id="filters" role="search"><label>Search courses<input type="search" id="query" maxlength="100"></label><label>Topic<select id="topic"><option value="all">All topics</option><option value="web">Web</option><option value="code">Code</option><option value="data">Data</option></select></label><label class="check"><input type="checkbox" id="saved-only">Bookmarked only</label><button type="submit">Search</button><button type="button" id="clear">Clear filters</button></form>
<p id="count" role="status"></p><p id="status" role="status"></p><p id="empty" hidden>No matching courses. Clear the filters or try fewer words.</p><section id="courses" aria-label="Courses"></section><noscript>The interactive catalog needs browser scripting. <a href="about.html">Read the project description</a>.</noscript></main><footer>IT-Worlds practice project · sample data only</footer></body></html>
