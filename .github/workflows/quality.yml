name: Quality
on:
  push:
    branches: [main, codex/cloudstand-lokal]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  document-compiler:
    name: Isolated LaTeX and Typst examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IT_WORLDS_COMPILER_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - run: docker build -t it-worlds-document-compiler:2026-10-25 services/document-compiler
      - run: node --experimental-strip-types --test tests/document-compiler.test.ts tests/document-service.test.ts
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.0', '24']
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install verified Typst 0.15.1 for published examples
        shell: bash
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o "$RUNNER_TEMP/typst.tar.xz"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run seo:check
      - run: npm run links:check
  container-example:
    name: Published container example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IT_WORLDS_DOCKER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - run: node --experimental-strip-types --test tests/container-examples.test.ts
  sql-examples:
    name: Published PostgreSQL examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: it_worlds_test
          POSTGRES_DB: it_worlds_examples_test
          POSTGRES_PASSWORD: disposable-ci-database-only
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U it_worlds_test -d it_worlds_examples_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IT_WORLDS_SQL_TEST: '1'
      PGHOST: '127.0.0.1'
      PGPORT: '55438'
      PGUSER: it_worlds_test
      PGDATABASE: it_worlds_examples_test
      PGPASSWORD: disposable-ci-database-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - run: node --experimental-strip-types --test tests/sql-examples.test.ts
